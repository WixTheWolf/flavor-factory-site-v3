name: Preview quality check

on:
  pull_request:
    branches: ["TFF-Typography-v1"]

permissions:
  contents: read

concurrency:
  group: preview-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check copy punctuation
        run: npm run lint:copy

      - name: Build
        run: npm run build
