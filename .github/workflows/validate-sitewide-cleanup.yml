name: Validate sitewide cleanup

on:
  pull_request:
    branches: ["TFF-Typography-v1"]

permissions:
  contents: read

concurrency:
  group: validate-sitewide-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Copy check
        run: npm run lint:copy

      - name: Build
        run: npm run build
